[pytest]
# `pytest tests` runs everything (what you do locally).
# The daily GitHub Action runs `-m "not slow"` BEFORE the pipeline (so a broken change can't
# publish bad data) and `-m slow` AFTER the data is saved (so a slow rehearsal can't delay it).
markers =
    slow: takes more than ~5 s (full pipeline rehearsals, whole-backtest comparisons)
# Deprecation warnings raised from OUR code are errors: a pandas/numpy upgrade that will change
# behaviour shows up as a red test today instead of a silently different number later.
# The regex is the module the warning is attributed to; third-party internals are excluded.
filterwarnings =
    error::DeprecationWarning:(?!(pandas|numpy|yfinance|requests|urllib3|dateutil|pytz|_pytest|pytest|pluggy|streamlit|altair|pyarrow|yaml|importlib|pkg_resources|setuptools|tornado|google|jsonschema|attr|multitasking|peewee|bs4|curl_cffi|websockets)\b)
    error::FutureWarning:(?!(pandas|numpy|yfinance|requests|urllib3|dateutil|pytz|_pytest|pytest|pluggy|streamlit|altair|pyarrow|yaml|importlib|pkg_resources|setuptools|tornado|google|jsonschema|attr|multitasking|peewee|bs4|curl_cffi|websockets)\b)
